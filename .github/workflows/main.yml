package com.flyersssignal.app

import android.os.Bundle
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.foundation.background
import androidx.compose.foundation.layout.*
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.graphics.Color
import androidx.compose.ui.text.font.FontWeight
import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp
import kotlinx.coroutines.delay
import retrofit2.Retrofit
import retrofit2.converter.gson.GsonConverterFactory
import retrofit2.http.GET
import com.google.gson.annotations.SerializedName

// === API ===
interface MarketApi {
    @GET("price") suspend fun getPrice(): MarketResponse
}
data class MarketResponse(val xau: XauData, @SerializedName("updated_at") val updatedAt: String)
data class XauData(val price: Double, val currency: String)

val api = Retrofit.Builder()
    .baseUrl("https://flyerss-signal-api.prohunterkhil08.workers.dev/")
    .addConverterFactory(GsonConverterFactory.create())
    .build().create(MarketApi::class.java)

// === WARNA ===
object AppColors {
    val DarkNavy = Color(0xFF0A0F1C)
    val CardBg = Color(0xFF121826)
    val Gold = Color(0xFFD4AF37)
    val NeonGreen = Color(0xFF00FF88)
    val LiveCyan = Color(0xFF00E5FF)
    val TextSecondary = Color(0xFF94A3B8)
    val Purple = Color(0xFF7B61FF)
}

class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent { FLYERSSApp() }
    }
}

@Composable
fun FLYERSSApp() {
    var price by remember { mutableDoubleStateOf(0.0) }
    var lastUpdate by remember { mutableStateOf("--:--:--") }
    var isLive by remember { mutableStateOf(false) }
    
    LaunchedEffect(Unit) {
        suspend fun load() {
            try {
                val res = api.getPrice()
                price = res.xau.price
                lastUpdate = res.updatedAt.substring(11, 19)
                isLive = true
            } catch (e: Exception) { isLive = false }
        }
        load()
        while (true) { delay(15000); load() }
    }
    
    Column(
        Modifier.fillMaxSize().background(AppColors.DarkNavy).padding(20.dp),
        horizontalAlignment = Alignment.CenterHorizontally
    ) {
        Spacer(Modifier.height(40.dp))
        Text("FLYERSS SIGNAL", color = AppColors.Gold, fontSize = 26.sp, fontWeight = FontWeight.Bold)
        Spacer(Modifier.height(8.dp))
        Row(verticalAlignment = Alignment.CenterVertically) {
            Box(Modifier.size(8.dp).background(if(isLive) AppColors.NeonGreen else Color.Red, shape = androidx.compose.foundation.shape.CircleShape))
            Spacer(Modifier.width(6.dp))
            Text(if(isLive) "LIVE · XAU/USD" else "OFFLINE", color = AppColors.TextSecondary, fontSize = 13.sp)
        }
        Spacer(Modifier.height(40.dp))
        Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = AppColors.CardBg)) {
            Column(Modifier.padding(30.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                Text("XAU/USD", color = AppColors.TextSecondary)
                Spacer(Modifier.height(12.dp))
                Text(if(price>0.0) "%.2f".format(price) else "--", color = AppColors.LiveCyan, fontSize = 48.sp, fontWeight = FontWeight.Bold)
                Spacer(Modifier.height(8.dp))
                Text("Kemaskini: $lastUpdate", color = AppColors.TextSecondary, fontSize = 12.sp)
            }
        }
        Spacer(Modifier.height(30.dp))
        Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = AppColors.CardBg)) {
            Column(Modifier.padding(25.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                Text("TIADA ISYARAT", color = AppColors.Purple, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                Spacer(Modifier.height(8.dp))
                Text("Menunggu pasaran sah...", color = AppColors.TextSecondary)
            }
        }
    }
}
